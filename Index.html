<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СКАНЕР</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#111;color:white}
h1{text-align:center}
button{width:100%;padding:18px;margin:7px 0;font-size:20px;border:0;border-radius:12px}
.start{background:#19a64a;color:white}
.stop{background:#c83c3c;color:white}
#video{width:100%;max-height:420px;background:#000;border-radius:12px;margin-top:10px}
#status{font-size:18px;text-align:center;margin:12px}
#count{font-size:28px;font-weight:bold;text-align:center}
.item{padding:12px;background:#222;margin:5px 0;border-radius:8px}
</style>
</head>
<body>

<h1>СКАНЕР</h1>

<button class="start" onclick="startScan()">НАЧАТЬ ПАЧКУ</button>
<button class="stop" onclick="stopScan()">ЗАКОНЧИТЬ ПАЧКУ</button>

<div id="count">Отсканировано: 0</div>
<div id="status">Готов к работе</div>

<video id="video" playsinline></video>

<h2>Список</h2>
<div id="list"></div>

<script>
let codes=[];
let stream=null;
let detector=null;
let active=false;
let lastCode="";
let lastTime=0;

async function startScan(){
  try{
    codes=[];
    draw();
    active=true;

    if(!("BarcodeDetector" in window)){
      document.getElementById("status").innerText=
      "Этот браузер не поддерживает сканирование. Откройте страницу в Chrome.";
      return;
    }

    detector=new BarcodeDetector({
      formats:["ean_13","ean_8","code_128","code_39","upc_a","upc_e"]
    });

    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    const video=document.getElementById("video");
    video.srcObject=stream;
    await video.play();

    document.getElementById("status").innerText="Наводите камеру на штрих-код";
    scan();
  }catch(e){
    document.getElementById("status").innerText=
    "Не удалось включить камеру. Разрешите доступ к камере.";
  }
}

async function scan(){
  if(!active) return;

  try{
    const results=await detector.detect(document.getElementById("video"));

    if(results.length){
      const code=results[0].rawValue;
      const now=Date.now();

      if(code && (code!==lastCode || now-lastTime>2000)){
        lastCode=code;
        lastTime=now;
        codes.push(code);

        if(navigator.vibrate) navigator.vibrate(120);

        document.getElementById("status").innerText="Считано: "+code;
        draw();
      }
    }
  }catch(e){}

  requestAnimationFrame(scan);
}

function stopScan(){
  active=false;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  document.getElementById("status").innerText=
  "Пачка закончена. Всего: "+codes.length;
}

function draw(){
  document.getElementById("count").innerText=
  "Отсканировано: "+codes.length;

  document.getElementById("list").innerHTML=
  codes.map((c,i)=>
    '<div class="item">'+(i+1)+'. '+c+'</div>'
  ).join("");
}
</script>

</body>
</html>
