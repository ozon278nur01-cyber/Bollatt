<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>СКАНЕР</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 18px;
    background: #111;
    color: white;
}

h1 {
    text-align: center;
    font-size: 34px;
}

#count {
    text-align: center;
    font-size: 25px;
    margin: 15px 0;
}

#last {
    text-align: center;
    font-size: 20px;
    min-height: 60px;
    padding: 12px;
    background: #222;
    border-radius: 12px;
    margin-bottom: 15px;
}

video {
    width: 100%;
    max-height: 420px;
    background: black;
    border-radius: 12px;
    display: none;
}

button {
    width: 100%;
    padding: 20px;
    margin

  try{
    const results=await detector.detect(document.getElementById("video"));

    if(results.length){
      const code=results[0].rawValue;
      const now=Date.now();

      if(code && (code!==lastCode || now-lastTime>2000)){
        lastCode=code;
        lastTime=now;
        codes.push(code);

        if(navigator.vibrate) navigator.vibrate(120);

        document.getElementById("status").innerText="Считано: "+code;
        draw();
      }
    }
  }catch(e){}

  requestAnimationFrame(scan);
}

function stopScan(){
  active=false;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  document.getElementById("status").innerText=
  "Пачка закончена. Всего: "+codes.length;
}

function draw(){
  document.getElementById("count").innerText=
  "Отсканировано: "+codes.length;

  document.getElementById("list").innerHTML=
  codes.map((c,i)=>
    '<div class="item">'+(i+1)+'. '+c+'</div>'
  ).join("");
}
</script>

</body>
</html>
